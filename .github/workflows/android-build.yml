name: Build Apollo Personal APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Apollo ARM64 Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;29.0.13113456"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Apollo source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="APOLLO_PERSONAL_1.3.1_APK_HOST_ALPHA1.zip"
          test -s "$archive"
          rm -rf apollo-source
          mkdir -p apollo-source
          unzip -q "$archive" -d apollo-source
          test -s apollo-source/package.json
          test -s apollo-source/android-host/settings.gradle.kts
          test -s apollo-source/android-host/host-app/build.gradle.kts
          test -s apollo-source/android-host/native/CMakeLists.txt
          test -s apollo-source/android-host/host-app/src/main/AndroidManifest.xml

      - name: Fetch pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 785322d17f2d51e5185cf996a1f4e46d87640841
          path: apollo-source/android-host/third_party/llama.cpp
          persist-credentials: false

      - name: Verify pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          test -s apollo-source/android-host/third_party/llama.cpp/CMakeLists.txt
          test -s apollo-source/android-host/third_party/llama.cpp/include/llama.h

      - name: Run Apollo source tests
        working-directory: apollo-source
        run: npm test

      - name: Build installable Apollo ARM64 debug APK
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set -euo pipefail
          cd apollo-source/android-host
          gradle :host-app:assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify APK contents and calculate checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find apollo-source/android-host/host-app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libapollo_llama_jni.so'
          if unzip -Z1 "$apk" | grep -Ei '\.(gguf|safetensors)$'; then
            echo 'Model weights must remain outside the APK.' >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "com.atlaslibrary.apollo.personal.debug"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload Apollo APK
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Personal-1.3.1-Debug-APK
          path: |
            ${{ steps.verify.outputs.apk_path }}
            ${{ steps.verify.outputs.apk_path }}.sha256
          if-no-files-found: error
          retention-days: 14
